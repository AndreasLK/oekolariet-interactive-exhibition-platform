# Runs the Editor Service and its own database together.
# Start: docker compose up --build   (from src/services/EditorService)
services:

  editor-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: editor-db
    environment:
      ACCEPT_EULA: "Y"
      # Read from the .env file next to this file. Never written here.
      MSSQL_SA_PASSWORD: ${EDITOR_DB_PASSWORD}
    ports:
      # 1433 on your PC → 1433 in the container, so you can also connect from Visual Studio.
      - "1433:1433"
    volumes:
      # Keeps the data when the container is stopped or removed.
      - editor-db-data:/var/opt/mssql
    healthcheck:
      # The database is "healthy" when it answers a simple query.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  editor-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: editor-api
    environment:
      # Development, so Swagger is shown at /swagger.
      ASPNETCORE_ENVIRONMENT: Development
      # "editor-db" is the service name above. Docker's network turns it into the database's address.
      ConnectionStrings__EditorDb: "Server=editor-db,1433;Database=EditorDb;User Id=sa;Password=${EDITOR_DB_PASSWORD};TrustServerCertificate=True"
    ports:
      # http://localhost:5187 on your PC → 8080 in the container.
      - "5187:8080"
    depends_on:
      # The Api waits until the database is healthy before it starts.
      editor-db:
        condition: service_healthy

volumes:
  editor-db-data: