name: CI-CD Pipeline

on:
  push:
    branches:
      - '[Mm][Aa][Ii][Nn]'
      - '[Mm][Aa][Ss][Tt][Ee][Rr]'
      - '[Ss][Tt][Aa][Gg][Ii][Nn][Gg]'
      - '[Ff][Ee][Aa][Tt][Uu][Rr][Ee]/**'
      - '[Ff][Ii][Xx]/**'
      - '[Hh][Oo][Tt][Ff][Ii][Xx]/**'
  pull_request:
    branches:
      - '[Mm][Aa][Ii][Nn]'
      - '[Mm][Aa][Ss][Tt][Ee][Rr]'
      - '[Ss][Tt][Aa][Gg][Ii][Nn][Gg]'

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  ci-build-and-test:
    name: 1. Build and Test Solution
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Branch Flow Policy
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Validating Pull Request: '$SOURCE_BRANCH' -> '$BASE_BRANCH'"

          if [[ "$BASE_BRANCH" == "main" || "$BASE_BRANCH" == "master" ]]; then
            if [[ "$SOURCE_BRANCH" != "staging" && "$SOURCE_BRANCH" != hotfix/* ]]; then
              echo "::error::Pull Requests into '$BASE_BRANCH' are ONLY allowed from 'staging' (or 'hotfix/*'). Your branch is '$SOURCE_BRANCH'."
              exit 1
            fi
          fi

          if [[ "$BASE_BRANCH" == "staging" ]]; then
            if [[ "$SOURCE_BRANCH" != feature/* && "$SOURCE_BRANCH" != fix/* && "$SOURCE_BRANCH" != hotfix/* && "$SOURCE_BRANCH" != "main" && "$SOURCE_BRANCH" != "master" ]]; then
              echo "::error::Pull Requests into 'staging' must come from a 'feature/*', 'fix/*', or 'hotfix/*' branch. Your branch is '$SOURCE_BRANCH'."
              exit 1
            fi
          fi

      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Compile C# solution
        run: dotnet build --no-restore --configuration Release

      - name: Run automated unit tests
        run: dotnet test --no-build --configuration Release

  find-dockerfiles:
    name: 2a. Find services with a Dockerfile
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Finds every src/services/<Service>/Dockerfile and outputs the service names as a JSON list,
      # e.g. ["ContentService","EditorService"]. A new service with a Dockerfile is picked up automatically.
      - name: Find Dockerfiles
        id: find
        run: |
          SERVICES=$(find src/services -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' \
            | xargs -r -n1 basename | jq -R . | jq -cs .)
          echo "Found: $SERVICES"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"

  cd-publish-docker:
    name: 2b. Build and Push ${{ matrix.service }}
    needs: find-dockerfiles
    runs-on: ubuntu-latest
    if: needs.find-dockerfiles.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      # One job per service, run side by side. One failing does not stop the others.
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.find-dockerfiles.outputs.services) }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Image name per service, e.g. ghcr.io/andreaslk/oekolariet-interactive-exhibition-platform/editorservice
      - name: Set image name and tag
        id: meta
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.REPO_NAME }}/${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/services/${{ matrix.service }}
          file: src/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}  
