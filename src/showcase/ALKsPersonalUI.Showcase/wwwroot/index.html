<!DOCTYPE html>
<html lang="en" style="background-color: #18181b; color: #ffffff;">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALK's Personal UI Showcase</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/ALKsPersonalUI/personal-ui.css" />
</head>

<body style="margin: 0; background-color: #18181b; color: #ffffff;">
    <div id="app">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
            <div style="width: 24px; height: 24px; border-radius: 50%; border: 3px solid #333333; border-top-color: #3b82f6; animation: spin 0.8s linear infinite;"></div>
            <span style="color: #a1a1aa; font-size: 0.95rem;">Loading WebAssembly...</span>
        </div>
        <style>
            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }

                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </div>

    <div id="blazor-error-ui" style="background: #ef4444; color: #ffffff; bottom: 0; box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2); display: none; left: 0; padding: 0.6rem 1.25rem; position: fixed; width: 100%; z-index: 2000; box-sizing: border-box;">
        An unhandled error has occurred.
        <a href="" class="reload" style="color: #ffffff; text-decoration: underline; margin-left: 0.5rem;">Reload</a>
        <a class="dismiss" style="cursor: pointer; position: absolute; right: 1.25rem; top: 0.5rem;">&#x2715;</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
