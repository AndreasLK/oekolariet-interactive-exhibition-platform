# Runs the Highscore Hub (central server) with its SQL Server database.
# Start: docker compose -f docker-compose.hub.yml up -d
services:

  highscore-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: highscore-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${HIGHSCORE_DB_PASSWORD:-Oekolariet!2026}
    ports:
      - "1434:1433"
    volumes:
      - highscore-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  highscore-hub-api:
    image: ghcr.io/andreaslk/oekolariet-interactive-exhibition-platform/highscoreservice:${IMAGE_TAG:-staging}
    container_name: highscore-hub-api
    restart: unless-stopped
    environment:
      APP_DLL: hub/HighscoreService.Hub.Api.dll
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      PathBase: /highscore
      Cors__AllowedOrigins__0: https://oekolariet.dk
      ConnectionStrings__HighscoreDatabase: "Server=highscore-db,1433;Database=OekolarietHighscores;User Id=sa;Password=${HIGHSCORE_DB_PASSWORD:-Oekolariet!2026};TrustServerCertificate=True;"
    ports:
      - "5280:8080"
    depends_on:
      highscore-db:
        condition: service_healthy

volumes:
  highscore-db-data:

