<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ContentService Gallery</title>
        <base href="/" />
        <link rel="stylesheet" href="_content/ALKsPersonalUI/personal-ui.css" />
        <link rel="stylesheet" href="ContentService.Web.styles.css" />
        <style>
                /* Critical initial-paint styles & OrbitalLoader+Mars matching ALKsPersonalUI until Blazor WASM mounts. */
                html, body {
                        margin: 0;
                        padding: 0;
                        min-height: 100vh;
                        background-color: #18181b;
                        color: #ffffff;
                        font-family: sans-serif;
                }

                .initial-loader-backdrop {
                        min-height: 100vh;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        background-color: #18181b;
                }

                .initial-spinner-container {
                        --calc-system-size: 90px;
                        --calc-orbit-tilt: 80deg;
                        --calc-sat-size: 3px;
                        --orbit-radius: calc(var(--calc-system-size) / 2);
                        --orbit-untilt: calc(var(--calc-orbit-tilt) * -1);
                        --sat-offset: calc(var(--calc-sat-size) / -2);
                        --safe-bounding-box: calc(var(--calc-system-size) * 1.5);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        gap: 1rem;
                        padding: 1rem;
                }

                .initial-planetary-system {
                        position: relative;
                        width: var(--safe-bounding-box);
                        height: var(--safe-bounding-box);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        transform-style: preserve-3d;
                }

                .initial-payload-stabilizer {
                        position: absolute;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        z-index: 10;
                }

                .initial-mars {
                        position: relative;
                        width: 46px;
                        height: 46px;
                        border-radius: 50%;
                        background-color: #e66a3d;
                        overflow: hidden;
                }

                .initial-mars-crater {
                        position: absolute;
                        border-radius: 50%;
                        background-color: rgba(130, 30, 0, 0.35);
                        border: 1px solid rgba(255, 255, 255, 0.15);
                }

                .initial-mars-lighting {
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        border-radius: 50%;
                        z-index: 2;
                        background: linear-gradient(90deg, transparent 48%, rgba(5, 5, 15, 0.95) 52%);
                        animation: initial-day-night-cycle 12s linear infinite;
                }

                @keyframes initial-day-night-cycle {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                }

                .initial-orbit-plane {
                        position: absolute;
                        width: 0;
                        height: 0;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        transform-style: preserve-3d;
                        animation: initial-precession-plane 30s linear infinite;
                }

                @keyframes initial-precession-plane {
                        from { transform: rotateZ(0deg) rotateX(var(--calc-orbit-tilt)); }
                        to { transform: rotateZ(360deg) rotateX(var(--calc-orbit-tilt)); }
                }

                .initial-sat-orbit {
                        position: absolute;
                        width: 0;
                        height: 0;
                        transform-style: preserve-3d;
                        animation: initial-spin-orbit 3s linear infinite;
                        animation-delay: var(--delay);
                }

                @keyframes initial-spin-orbit {
                        from { transform: rotateZ(0deg); }
                        to { transform: rotateZ(360deg); }
                }

                .initial-sat-translate {
                        position: absolute;
                        transform-style: preserve-3d;
                        transform: translateY(calc(var(--orbit-radius) * -1));
                }

                .initial-sat-counter {
                        position: absolute;
                        transform-style: preserve-3d;
                        animation: initial-counter-spin 3s linear infinite;
                        animation-delay: var(--delay);
                }

                @keyframes initial-counter-spin {
                        from { transform: rotateZ(0deg); }
                        to { transform: rotateZ(-360deg); }
                }

                .initial-sat-model {
                        position: absolute;
                        top: var(--sat-offset);
                        left: var(--sat-offset);
                        width: var(--calc-sat-size);
                        height: var(--calc-sat-size);
                        border-radius: 50%;
                        animation: initial-astrophysics 3s ease-in-out infinite;
                        animation-delay: var(--delay);
                }

                @keyframes initial-astrophysics {
                        0% {
                                background-color: var(--base-color);
                                transform: rotateX(var(--orbit-untilt)) scale(0.5);
                                box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
                        }
                        25% {
                                background-color: var(--base-color);
                                transform: rotateX(var(--orbit-untilt)) scale(1.0);
                                box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
                        }
                        50% {
                                background-color: var(--base-color);
                                transform: rotateX(var(--orbit-untilt)) scale(1.6);
                                box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5), 0 -15px 8px -3px rgba(0,0,0,0.8);
                        }
                        75% {
                                background-color: var(--base-color);
                                transform: rotateX(var(--orbit-untilt)) scale(1.0);
                                box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
                        }
                        100% {
                                background-color: var(--base-color);
                                transform: rotateX(var(--orbit-untilt)) scale(0.5);
                                box-shadow: inset -1px -1px 2px rgba(0,0,0,0.5);
                        }
                }

                .initial-spinner-text {
                        color: #a0a0a0;
                        font-family: sans-serif;
                        font-size: 0.85rem;
                        letter-spacing: 0.1em;
                        text-transform: uppercase;
                }
        </style>
</head>

<body>
        <div id="app">
                <div class="initial-loader-backdrop" role="status" aria-live="polite">
                        <div class="initial-spinner-container">
                                <div class="initial-planetary-system">
                                        <div class="initial-payload-stabilizer">
                                                <div class="initial-mars">
                                                        <div class="initial-mars-crater" style="width: 14px; height: 14px; top: 18%; left: 22%;"></div>
                                                        <div class="initial-mars-crater" style="width: 9px; height: 9px; top: 58%; left: 60%;"></div>
                                                        <div class="initial-mars-crater" style="width: 6px; height: 6px; top: 34%; left: 66%;"></div>
                                                        <div class="initial-mars-lighting"></div>
                                                </div>
                                        </div>
                                        <div class="initial-orbit-plane">
                                                <div class="initial-sat-orbit" style="--delay: 0s;">
                                                        <div class="initial-sat-translate">
                                                                <div class="initial-sat-counter" style="--delay: 0s;">
                                                                        <div class="initial-sat-model" style="--delay: 0s; --base-color: #fff099;"></div>
                                                                </div>
                                                        </div>
                                                </div>
                                                <div class="initial-sat-orbit" style="--delay: -1s;">
                                                        <div class="initial-sat-translate">
                                                                <div class="initial-sat-counter" style="--delay: -1s;">
                                                                        <div class="initial-sat-model" style="--delay: -1s; --base-color: #00ffff;"></div>
                                                                </div>
                                                        </div>
                                                </div>
                                                <div class="initial-sat-orbit" style="--delay: -2s;">
                                                        <div class="initial-sat-translate">
                                                                <div class="initial-sat-counter" style="--delay: -2s;">
                                                                        <div class="initial-sat-model" style="--delay: -2s; --base-color: #ff0000;"></div>
                                                                </div>
                                                        </div>
                                                </div>
                                        </div>
                                </div>
                                <div class="initial-spinner-text">Loading ContentService Gallery...</div>
                        </div>
                </div>
        </div>
        <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
