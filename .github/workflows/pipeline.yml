name: CI-CD Pipeline

on:
  push:
    branches:
      - '[Mm][Aa][Ii][Nn]'
      - '[Mm][Aa][Ss][Tt][Ee][Rr]'
      - '[Ss][Tt][Aa][Gg][Ii][Nn][Gg]'
      - '[Ff][Ee][Aa][Tt][Uu][Rr][Ee]/**'
      - '[Ff][Ii][Xx]/**'
      - '[Hh][Oo][Tt][Ff][Ii][Xx]/**'
  pull_request:
    branches:
      - '[Mm][Aa][Ii][Nn]'
      - '[Mm][Aa][Ss][Tt][Ee][Rr]'
      - '[Ss][Tt][Aa][Gg][Ii][Nn][Gg]'

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  ci-build-and-test:
    name: 1. Build and Test Solution
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Branch Flow Policy
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Validating Pull Request: '$SOURCE_BRANCH' -> '$BASE_BRANCH'"

          if [[ "$BASE_BRANCH" == "main" || "$BASE_BRANCH" == "master" ]]; then
            if [[ "$SOURCE_BRANCH" != "staging" && "$SOURCE_BRANCH" != hotfix/* ]]; then
              echo "::error::Pull Requests into '$BASE_BRANCH' are ONLY allowed from 'staging' (or 'hotfix/*'). Your branch is '$SOURCE_BRANCH'."
              exit 1
            fi
          fi

          if [[ "$BASE_BRANCH" == "staging" ]]; then
            if [[ "$SOURCE_BRANCH" != feature/* && "$SOURCE_BRANCH" != fix/* && "$SOURCE_BRANCH" != hotfix/* && "$SOURCE_BRANCH" != "main" && "$SOURCE_BRANCH" != "master" ]]; then
              echo "::error::Pull Requests into 'staging' must come from a 'feature/*', 'fix/*', or 'hotfix/*' branch. Your branch is '$SOURCE_BRANCH'."
              exit 1
            fi
          fi

      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Compile C# solution
        run: dotnet build --no-restore --configuration Release

      - name: Run automated unit tests
        run: dotnet test --no-build --configuration Release

  cd-publish-docker:
    name: 2. Build and Push Docker Images
    needs: ci-build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Locate Dockerfile and set metadata
        id: meta
        run: |
          DOCKERFILE=$(find . -name "Dockerfile" -not -path '*/.*' | head -n 1)

          if [[ -z "$DOCKERFILE" ]]; then
            echo "No Dockerfile found. Skipping Docker build and push."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "context_dir=$(dirname "$DOCKERFILE")" >> "$GITHUB_OUTPUT"

          IMAGE_BASE=$(echo "${{ env.REGISTRY }}/${{ env.REPO_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_BASE" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "tag=staging" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.found == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.meta.outputs.found == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.meta.outputs.context_dir }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
